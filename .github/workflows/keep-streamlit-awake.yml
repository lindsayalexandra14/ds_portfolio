name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */6 * * *"  # Trigger every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait random time (0–6 hours)
        run: |
          # Generate random seconds up to 6 hours (21600 sec)
          DELAY=$(( RANDOM % 21600 ))
          echo "Sleeping for $DELAY seconds (~$((DELAY/3600))h)."
          sleep $DELAY

      - name: Ping Streamlit App
        run: curl -s https://dsportfolio-divorce-eda.streamlit.app/ > /dev/null
